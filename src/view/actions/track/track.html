<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Tealium Collect Override Settings</title>
    <link href="../../styles/bootstrap.min.css" rel="stylesheet" />


</head>
<body class="p-3">
  <h1 class="mb-4">Tealium Collect Event Settings</h1>
    <div class="alert alert-info mb-4" role="alert">
    Use these settings to override the Tealium account and/or profile defined in the main extension configuration. 
    You can enter static values or reference data elements (e.g., <code>%Tealium Account%</code>).
  </div>
  <form>
    <div class="mb-3">
      <label for="account" class="form-label">Override Account</label>
      <input
        type="text"
        id="account"
        class="form-control"
        data-element-type="dataElement"
        placeholder="Enter Tealium Account or %Data Element%"
      />
    </div>

    <div class="mb-3">
      <label for="profile" class="form-label">Override Profile</label>
      <input
        type="text"
        id="profile"
        class="form-control"
        data-element-type="dataElement"
        placeholder="Enter Tealium Profile or %Data Element%"
      />
    </div>

    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>


  <script src="https://assets.adobedtm.com/activation/reactor/extensionbridge/extensionbridge.min.js"></script>
  <script>
    window.extensionBridge.register({
      init: function(info) {
        if (info.settings) {
          document.getElementById('account').value = info.settings.account || '';
          document.getElementById('profile').value = info.settings.profile || ''; 
        }
      },

      getSettings: function() {
        return {
          account: document.getElementById('account').value,
          profile: document.getElementById('profile').value
        };
      },

      validate: function() {
        return true;
      }
    });
  </script>
</body>
</html>
